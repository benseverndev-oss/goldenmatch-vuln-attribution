name: Full vuln-reconciliation pipeline

# Heavy bulk-data run: fetches ~1.5 GB of public vuln archives, extracts
# 6M+ rows, runs goldencheck → goldenflow → goldenmatch end-to-end, and
# uploads the JSON outputs as workflow artifacts.
#
# Target runner: large-new-64GB (16 vCPU / 64 GB RAM / 600 GB SSD).

on:
  workflow_dispatch:
    inputs:
      skip_cvelist:
        description: "Skip the 556 MB CVE Project bulk archive"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed for the rolling `latest` release publish step

jobs:
  pipeline:
    runs-on: large-new-64GB
    timeout-minutes: 120
    env:
      SKIP_CVELIST: ${{ inputs.skip_cvelist && '1' || '' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System snapshot
        run: |
          echo "## Runner specs"
          nproc
          free -h
          df -h /
          python --version

      - name: Fetch public datasets
        run: python -u fetch_public_data.py

      - name: Extract to parquet
        run: python -u extract_records.py

      - name: GoldenCheck DQ scan
        run: python -u dq_check.py

      - name: GoldenFlow normalize
        run: python -u normalize.py

      - name: GoldenMatch ER + analysis
        run: python -u analyze.py

      - name: Range-disagreement sweep
        run: python -u analyze_ranges.py

      - name: Timing-lag analysis (CVE -> OSV / GHSA / KEV first-seen dates)
        run: python -u analyze_timing.py

      - name: Cross-source independence (de-overlap fix-version disagreement)
        run: python -u analyze_independence.py

      - name: Representability (package-expressible vs operational/system)
        run: python -u analyze_representability.py

      - name: Representability taxonomy (5-bucket source-presence model)
        run: python -u analyze_representability_taxonomy.py

      - name: Actionability (representable AND has published fix event)
        run: python -u analyze_actionability.py

      - name: Convergence-inversion statistical test
        run: python -u analyze_convergence_inversion.py

      - name: Sample-SBOM check (end-to-end demo of check_affected)
        run: python -u check_affected.py --sbom examples/sample_sbom.json --out output/sample_sbom_report.json

      - name: Review worksheets (sampling CSVs for manual qualitative validation)
        run: python -u sample_for_review.py --n 100

      - name: Summarize outputs
        run: |
          ls -la output/
          echo "---"
          echo "report.json headline:"
          python -c "import json; r=json.load(open('output/report.json')); [print(f'  {k}: {v}') for k,v in r.items() if not isinstance(v, dict)]; print('  kev:', r.get('kev')); print('  high_epss_blind_spot:', r.get('high_epss_blind_spot'))"

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            output/*.json
          retention-days: 30

      - name: Upload records parquet (for downstream re-analysis)
        uses: actions/upload-artifact@v4
        with:
          name: records-parquet
          path: |
            data/records.parquet
            data/records_normalized.parquet
          retention-days: 30
          if-no-files-found: warn

      # ---------- Publish a rolling `latest` GitHub release ----------
      # Lets people pull the parquet + JSONs over plain HTTPS without
      # needing the `gh` CLI or any auth. The release is recreated each
      # successful run so the URL is stable and the content is fresh.
      - name: Publish artifacts to rolling `latest` release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          NOTES_FILE="$(mktemp)"
          {
            echo "Rolling artifact bundle from \`full-pipeline.yml\` run ${GITHUB_RUN_ID}."
            echo ""
            echo "Built on $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA}."
            echo ""
            echo "## Files"
            echo "- \`records_normalized.parquet\` -- goldenflow-normalized parquet (the matcher's input)"
            echo "- \`report.json\` -- headline reconciliation stats"
            echo "- \`kev_clusters.json\` -- KEV drill-down"
            echo "- \`famous_vulns.json\`, \`top_disagreement.json\` -- ER samples"
            echo "- \`range_disagreement.json\` -- cross-source fix agreement sweep"
            echo "- \`timing_lag.json\` -- CVE -> source-first-seen lag distributions"
            echo "- \`independence.json\` -- cross-source fix-version agreement after de-overlap"
            echo "- \`representability.json\` -- package-representability rates by KEV / EPSS slice"
            echo "- \`representability_taxonomy.json\` -- 5-bucket source-presence taxonomy cross-tabbed against KEV / EPSS / ransomware"
            echo "- \`actionability.json\` -- representable CVEs that ship a concrete \`fixed\` event"
            echo "- \`convergence_inversion.json\` -- Wilson CIs + chi-square tests on mirror-vs-independent disagreement rates"
            echo "- \`review_worksheets.zip\` -- 6 CSV worksheets for manual qualitative validation (KEV blind spots, contradictions, orphans, etc.)"
            echo "- \`sample_sbom_report.json\` -- verdicts for examples/sample_sbom.json"
            echo "- \`dq_report.json\` -- goldencheck DQ findings"
          } > "$NOTES_FILE"

          # Stage assets in a flat directory so filenames in the release are clean.
          stage="$(mktemp -d)"
          cp data/records_normalized.parquet "$stage/"
          # Bundle the review worksheets as a single zip so people can
          # download a starter pack with one curl rather than 6.
          (cd output && zip -q -r "$stage/review_worksheets.zip" review/)
          cp output/report.json output/kev_clusters.json output/famous_vulns.json \
             output/top_disagreement.json output/range_disagreement.json \
             output/timing_lag.json output/independence.json output/representability.json \
             output/representability_taxonomy.json output/actionability.json \
             output/convergence_inversion.json \
             output/sample_sbom_report.json output/dq_report.json "$stage/"

          # Delete and recreate the tag so the release always points at the
          # latest run. `gh release delete --cleanup-tag -y` removes both.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag -y
          fi
          gh release create "$TAG" \
            --title "Latest pipeline outputs" \
            --notes-file "$NOTES_FILE" \
            "$stage"/*
